# 投稿生成・検証の設定（簡易YAML: key: value と '- item' リストのみ）

target: 20〜35歳の副業志望の男性。AIや効率化ツールに興味があり、即効性のある情報を好む。
tone: カジュアルだが情報提供型。断定しすぎない。

# weighted: Xの重み付けカウント（日本語1文字=2、上限280） / simple: 単純文字数（上限140）
count_mode: weighted

# 避けたい表現（含まれたら不合格）
ng_words:
  - 絶対に稼げる
  - 必ず儲かる
  - 情弱

# 誇張表現（含まれたら不合格）
hype_words:
  - 絶対
  - 100%
  - 誰でも
  - 必ず
  - 確実に
  - 完全に

# 検出したら「要目視確認」の警告を出す（不合格にはしない）
review_keywords:
  - 病気
  - 治療
  - 症状
  - 薬
  - 投資
  - 株
  - 利回り
  - 確定申告
  - 税金
  - 法律
  - 訴訟
  - 契約
